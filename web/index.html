<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Plum — Une photo, deux phrases</title>
    <meta
      name="description"
      content="Plum est une application de rencontres pour iOS. Une photo, deux phrases, et on verra bien."
    />
    <!-- Deux balises, et un `media` sur chacune : c'est la version qui
         fonctionne sans JavaScript. Le script ci-dessous les réécrit dès
         qu'un choix explicite existe. #40183A est le bas du dégradé de
         l'icône — la même couleur de marque, celle qui ne vient pas
         éclairer le haut d'un écran qu'on a voulu sombre. -->
    <meta
      name="theme-color"
      content="#6B2D5C"
      media="(prefers-color-scheme: light)"
    />
    <meta
      name="theme-color"
      content="#40183A"
      media="(prefers-color-scheme: dark)"
    />
    <meta property="og:title" content="Plum — Une photo, deux phrases" />
    <meta
      property="og:description"
      content="Une photo, deux phrases, et on verra bien."
    />
    <meta property="og:type" content="website" />
    <!-- L'ordre compte : les navigateurs qui savent lire le SVG le prennent et
         ignorent le reste. Les PNG servent aux autres, et le 16 pixels n'est
         pas une réduction automatique du même dessin — c'est la silhouette de
         la marque, parce qu'à cette taille ses filets intérieurs disparaissent
         dans le gris. Voir Scripts/generate_favicons.py. -->
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon-32.png" sizes="32x32" type="image/png" />
    <link rel="icon" href="/favicon-16.png" sizes="16x16" type="image/png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" sizes="180x180" />
    <link rel="manifest" href="/site.webmanifest" />
    <!--
      Le choix de thème, relu avant le premier pixel.

      Il est en clair dans la page, et pas dans le wasm, parce que le wasm est
      chargé en `module` — donc différé — et qu'il pèse plus lourd que le
      bundle qu'il remplace. Une page pré-rendue en clair s'afficherait le
      temps d'un éclair avant que l'application ne la repeigne : en pleine
      nuit, c'est précisément ce qu'un thème sombre sert à éviter. Le
      remplacement de React par Yew rend donc ce script *plus* nécessaire, pas
      moins.

      La clé « plum.theme » est recopiée de `src/theme.rs` ;
      `Scripts/check_theme.py` vérifie qu'elles ne se sont pas séparées.
    -->
    <script>
      try {
        var choix = localStorage.getItem("plum.theme");
        if (choix === "light" || choix === "dark") {
          document.documentElement.dataset.theme = choix;
        }
      } catch (erreur) {
        /* Navigation privée : le thème automatique reste juste. */
      }
      /*
        Le rideau d'ouverture, une fois par session. Décidé ici, avant le
        premier pixel, pour la même raison que le thème : posé plus tard par
        un script différé, il laisserait d'abord voir la page qu'il est censé
        découvrir. Jamais si la personne a demandé moins de mouvement.
      */
      try {
        if (
          !matchMedia("(prefers-reduced-motion: reduce)").matches &&
          !sessionStorage.getItem("plum.rideau")
        ) {
          sessionStorage.setItem("plum.rideau", "1");
          document.documentElement.classList.add("porte");
        }
      } catch (erreur) {
        /* Sans stockage de session, pas de rideau : mieux vaut aucun qu'un à
           chaque page. */
      }
    </script>
    <!--
      Les fonctionnalités wasm que l'artefact exige, nommées une par une.

      Le compilateur Rust émet des instructions que le `wasm-opt` épinglé par
      Trunk refuse de valider par défaut — la construction échoue sur
      « memory.copy operations require bulk memory operations », ce qui ne dit
      pas d'où ça vient. `--all-features` règle le problème et rend seize
      kilo-octets de moins, mais il autorise tout : on ne saurait plus ce que
      le fichier demande au navigateur. Cette liste-là, si. Toutes sont
      portées par Safari 15 et au-delà, donc par les iPhone que
      l'application vise.

      `data-integrity="none"` : Trunk pose un `integrity` sur le `preload` du
      wasm, et Chromium avertit qu'il l'ignore — un `preload` dont la
      destination ne gère pas l'intégrité de sous-ressource. Le garde-fou du
      thème relève tout ce qui parle dans la console, et il a raison : une
      console qui bavarde est une console qu'on cesse de lire. L'attribut ne
      protégeait rien puisqu'il était ignoré.
    -->
    <link
      data-trunk
      rel="rust"
      data-bin="plum-site"
      data-wasm-opt="z"
      data-integrity="none"
      data-wasm-opt-params="--enable-bulk-memory --enable-bulk-memory-opt --enable-sign-ext --enable-mutable-globals --enable-nontrapping-float-to-int --enable-reference-types --enable-multivalue"
    />
    <link data-trunk rel="css" href="src/theme.css" />
    <!--
      Le mouvement de la page d'accueil : la poussière, la lueur, les aimants.
      Un module à part, chargé en différé, et indépendant du wasm : il démarre
      sans attendre l'hydratation, et la page est complète sans lui.
    -->
    <script data-trunk src="src/animations.js" type="module"></script>
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
