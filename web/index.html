<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Plum — Une photo, deux phrases</title>
    <meta
      name="description"
      content="Plum est une application de rencontres pour iOS. Une photo, deux phrases, et on verra bien."
    />
    <!-- Deux balises, et un `media` sur chacune : c'est la version qui
         fonctionne sans JavaScript. Le script ci-dessous les réécrit dès
         qu'un choix explicite existe. #40183A est le bas du dégradé de
         l'icône — la même couleur de marque, celle qui ne vient pas
         éclairer le haut d'un écran qu'on a voulu sombre. -->
    <meta
      name="theme-color"
      content="#6B2D5C"
      media="(prefers-color-scheme: light)"
    />
    <meta
      name="theme-color"
      content="#40183A"
      media="(prefers-color-scheme: dark)"
    />
    <meta property="og:title" content="Plum — Une photo, deux phrases" />
    <meta
      property="og:description"
      content="Une photo, deux phrases, et on verra bien."
    />
    <meta property="og:type" content="website" />
    <!-- L'ordre compte : les navigateurs qui savent lire le SVG le prennent et
         ignorent le reste. Les PNG servent aux autres, et le 16 pixels n'est
         pas une réduction automatique du même dessin — c'est la silhouette de
         la marque, parce qu'à cette taille ses filets intérieurs disparaissent
         dans le gris. Voir Scripts/generate_favicons.py. -->
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon-32.png" sizes="32x32" type="image/png" />
    <link rel="icon" href="/favicon-16.png" sizes="16x16" type="image/png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" sizes="180x180" />
    <link rel="manifest" href="/site.webmanifest" />
    <!--
      Le choix de thème, relu avant le premier pixel.

      Il est en clair dans la page, et pas dans le bundle, parce que le bundle
      est chargé en `module` — donc différé. Une page pré-rendue en clair
      s'afficherait le temps d'un éclair avant que React ne la repeigne : en
      pleine nuit, c'est précisément ce qu'un thème sombre sert à éviter.

      La clé « plum.theme » est recopiée de `src/theme.ts` ;
      `Scripts/check_theme.py` vérifie qu'elles ne se sont pas séparées.
    -->
    <script>
      try {
        var choix = localStorage.getItem("plum.theme");
        if (choix === "light" || choix === "dark") {
          document.documentElement.dataset.theme = choix;
        }
      } catch (erreur) {
        /* Navigation privée : le thème automatique reste juste. */
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
