name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  project:
    name: Projet Xcode
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Le projet est valide
        run: python3 Scripts/validate_pbxproj.py

      - name: La palette est cohérente
        run: python3 Scripts/check_palette.py

      - name: L'icône d'application est soumettable
        run: python3 Scripts/check_appicon.py

      - name: Jeu d'icônes du site
        run: python3 Scripts/check_favicons.py

      - name: Aucun bouton muet pour VoiceOver
        run: python3 Scripts/check_accessibility.py

      - name: Aucun nom de type en collision
        run: python3 Scripts/check_name_clashes.py

      - name: L'application porte le même nom partout
        run: python3 Scripts/check_app_name.py

      - name: Le thème clair/sombre est d'accord avec lui-même
        run: python3 Scripts/check_theme.py

      - name: La marque est la même partout où elle est dessinée
        run: python3 Scripts/check_mark.py

      - name: Le projet est à jour vis-à-vis des sources
        # Le pbxproj est généré : s'il diverge de l'arborescence, c'est qu'un
        # fichier a été ajouté ou supprimé sans régénérer.
        run: |
          python3 Scripts/generate_xcodeproj.py
          if ! git diff --quiet -- Plum.xcodeproj; then
            echo "::error::project.pbxproj ne correspond plus aux sources. Lancez : python3 Scripts/generate_xcodeproj.py"
            git --no-pager diff --stat -- Plum.xcodeproj
            exit 1
          fi

  site:
    name: Mise en page du site
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      # Le site est en Rust, compilé en WebAssembly. Trunk vient en binaire
      # déjà construit : le compiler coûterait plusieurs minutes à chaque
      # exécution pour un outil qui ne change pas.
      - name: Cible wasm et Trunk
        run: |
          rustup target add wasm32-unknown-unknown
          curl -sSL https://github.com/trunk-rs/trunk/releases/download/v0.21.14/trunk-x86_64-unknown-linux-gnu.tar.gz \
            | sudo tar -xzf - -C /usr/local/bin trunk
          trunk --version

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: web

      - name: Les trois langues ont la forme attendue
        working-directory: web
        run: cargo test --quiet

      - name: Construire
        working-directory: web
        run: |
          trunk build --release --features hydration
          cargo run --release --features ssr --bin prerender

      # Playwright reste en Node : c'est là que vit le navigateur piloté. Les
      # deux gardes lisent le `dist` construit et ne savent pas ce qui l'a
      # produit — c'est précisément ce qui a permis de prouver que le portage
      # de React vers Yew n'avait rien changé au comportement.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Dépendances du navigateur
        working-directory: web
        run: npm ci

      - name: Chromium
        working-directory: web
        run: npx playwright install --with-deps chromium

      # Ce qu'aucun contrôle statique ne voit : une page qui glisse
      # latéralement, une bascule de thème qui a l'air de marcher, et une
      # application qui ne démarre pas du tout — la racine `/` a rendu une
      # page blanche en production sans qu'aucun des deux premiers gardes ne
      # s'en aperçoive.
      - name: La page tient, le thème bascule, l'application démarre
        working-directory: web
        run: npm run verifier

  build:
    name: Build et tests iOS
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Version d'Xcode
        run: |
          ls /Applications | grep -i '^Xcode' || true
          xcodebuild -version

      - name: Build et tests
        run: ./Scripts/ci_test.sh

      # Les contrôles statiques comparent des sources entre elles : ils
      # prouvent que la recette est cohérente, pas que le plat lui ressemble.
      # Entre les deux il y a Xcode, qui doit décoder `\U2023` en son
      # caractère — sinon l'écran d'accueil afficherait la séquence en clair,
      # sans que rien ne s'en plaigne.
      - name: Le paquet construit porte le bon nom
        run: |
          set -euo pipefail
          paquets=(build/DerivedData/Build/Products/*-iphonesimulator/Plum.app)
          if [ ! -d "${paquets[0]}" ]; then
            echo "::error::Aucun Plum.app construit : il n'y a rien à vérifier."
            exit 1
          fi
          if [ "${#paquets[@]}" -ne 1 ]; then
            echo "::error::${#paquets[@]} paquets construits, un seul attendu : ${paquets[*]}"
            exit 1
          fi
          python3 Scripts/check_app_name.py --paquet "${paquets[0]}"

      - name: Avertissements du compilateur
        # Toujours, pas seulement en cas d'échec : un build vert qui accumule
        # des avertissements finit par en cacher un vrai.
        if: always()
        run: |
          if [ ! -f build.log ]; then
            echo "Pas de journal : la compilation n'a pas démarré."
            exit 0
          fi
          echo "::group::Erreurs"
          grep -E 'error:' build.log | sort -u | head -n 100 || true
          echo "::endgroup::"
          echo "::group::Avertissements (dédoublonnés)"
          grep -oE '[^ /]+\.swift:[0-9]+:[0-9]+: warning: .*' build.log | sort -u | head -n 100 || true
          echo "::endgroup::"
          count=$(grep -oE '[^ /]+\.swift:[0-9]+:[0-9]+: warning: .*' build.log | sort -u | wc -l | tr -d ' ')
          echo "Avertissements Swift uniques : ${count}"

      - name: Artefacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: journal-xcodebuild
          # Le bundle .xcresult pèse ~75 Mo et n'a rien apporté que le journal
          # ne disait déjà : on garde le journal seul.
          path: build.log
          retention-days: 7
