name: Serveur

on:
  push:
    branches: [master]
    paths:
      ["server/**", "web/**", "Dockerfile", "heroku.yml", ".github/workflows/server.yml"]
  pull_request:
    paths:
      ["server/**", "web/**", "Dockerfile", "heroku.yml", ".github/workflows/server.yml"]
  workflow_dispatch:

concurrency:
  group: server-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: server

jobs:
  test:
    name: Build et tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      # Le limiteur a deux implémentations, et seule celle en mémoire était
      # testée. C'est l'autre qui tourne en production, et c'est elle qui avait
      # tort : sans ce service, le test qui le prouve se saute en silence.
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: plum
          POSTGRES_DB: plum_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # Deliberately the Heroku spelling, so the URL normalisation is exercised
      # by every run rather than only by its unit test.
      TEST_DATABASE_URL: postgres://postgres:plum@localhost:5432/plum_test
      # Without this a Postgres that failed to start would show up as ten green
      # tests that executed nothing.
      REQUIRE_TEST_DATABASE: "1"
      TEST_REDIS_URL: redis://localhost:6379
      # Même raison que pour Postgres : un service qui n'a pas démarré ne doit
      # pas passer pour une exécution propre.
      REQUIRE_TEST_REDIS: "1"

    steps:
      - uses: actions/checkout@v4

      - name: Chaîne d'outils
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          rustup default stable
          rustc --version

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: server

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Tests
        run: cargo test --all-targets

  image:
    name: Image Docker
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # Built on every change, deployed only from master with a configured
      # Heroku app: a broken Dockerfile should fail on the pull request, not on
      # the deploy.
      - name: Construire
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: false
          load: true
          tags: plum-server:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: L'image démarre et réclame sa configuration
        run: |
          set +e
          output=$(docker run --rm plum-server:ci 2>&1)
          code=$?
          set -e
          echo "$output"
          if [ $code -eq 0 ]; then
            echo "::error::le binaire devrait refuser de démarrer sans DATABASE_URL"
            exit 1
          fi
          echo "$output" | grep -q "DATABASE_URL" || {
            echo "::error::l'échec ne nomme pas la variable manquante"
            exit 1
          }

  # Chaîne de déploiement *alternative*, dormante tant que les deux secrets
  # sont absents.
  #
  # Le dépôt déploie par `heroku.yml` : Heroku construit l'image lui-même
  # depuis GitHub. Les deux mécanismes s'excluent — le registre de conteneurs
  # et `heroku.yml` sont incompatibles — donc n'armer celui-ci qu'après avoir
  # coupé le déploiement automatique côté Heroku. Il existe comme repli si un
  # build Heroku venait à dépasser les 15 minutes qu'il s'accorde.
  deploy:
    # Nommé « chaîne de secours » et pas « Déployer sur Heroku », parce que ce
    # job se termine en vert quand les secrets sont absents — toutes ses étapes
    # sont sautées et il n'y a rien à échouer. Sous son ancien nom, ce vert se
    # lisait « déployé » alors que rien n'était parti : j'ai failli l'annoncer
    # ainsi. Un intitulé qui ne promet pas le déploiement coûte moins cher
    # qu'une vérification qu'on oublie de faire.
    name: Déployer sur Heroku (chaîne de secours)
    needs: image
    if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Heroku est-il configuré ?
        id: check
        env:
          HEROKU_API_KEY: ${{ secrets.HEROKU_API_KEY }}
          # Le nom de l'application n'est pas un secret : il est dans l'adresse
          # publique du site. L'exiger comme tel doublait la surface d'erreur
          # sans rien protéger — et c'est exactement là qu'elle s'est produite.
          # Il ne reste donc qu'une seule chose à poser : la clé.
          HEROKU_APP_NAME: ${{ vars.HEROKU_APP_NAME || secrets.HEROKU_APP_NAME || 'plum' }}
        run: |
          if [ -n "$HEROKU_API_KEY" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Rien n'a été déployé : HEROKU_API_KEY est absent. Ce job est vert parce qu'il n'avait rien à faire, pas parce qu'une version est partie."
          fi

          # Écrit noir sur blanc sur la page du run : c'est là qu'on regarde
          # quand on se demande si une version est partie.
          {
            echo "### Déploiement Heroku"
            echo
            if [ "$(grep -c 'ready=true' "$GITHUB_OUTPUT")" -gt 0 ]; then
              echo "Secrets présents — la chaîne de secours pousse l'image et publie."
            else
              echo "**Aucune version n'a été déployée par ce job.**"
              echo
              echo "Le secret \`HEROKU_API_KEY\` est vide côté workflow."
              echo
              echo "Il se pose dans **Settings → Secrets and variables → Actions**,"
              echo "onglet **Secrets**, bouton *New repository secret*. Trois pièges,"
              echo "dans l'ordre où ils se produisent :"
              echo "- l'onglet voisin **Variables** n'est pas lu par \`secrets.*\` ;"
              echo "- les sections **Dependabot** et **Codespaces** ont leurs propres"
              echo "  listes, invisibles d'un workflow ;"
              echo "- un secret posé sur un **Environment** n'est visible que d'un job"
              echo "  qui déclare cet environnement."
              echo
              echo "Le nom de l'application n'est plus requis : il vaut \`plum\` par"
              echo "défaut."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      # Le registre de conteneurs n'accepte que les applications dont le stack
      # est « container », et ce réglage n'existe pas dans le tableau de bord :
      # c'est `heroku stack:set container`, donc une ligne de commande. Le
      # workflow le pose lui-même, sans quoi tout ceci ne marcherait que depuis
      # un ordinateur — ce qui est exactement ce qu'on cherche à éviter.
      #
      # Idempotent : reposer un stack qu'on a déjà ne change rien.
      - name: S'assurer que l'application est sur le stack container
        if: steps.check.outputs.ready == 'true'
        env:
          HEROKU_API_KEY: ${{ secrets.HEROKU_API_KEY }}
          # Le nom de l'application n'est pas un secret : il est dans l'adresse
          # publique du site. L'exiger comme tel doublait la surface d'erreur
          # sans rien protéger — et c'est exactement là qu'elle s'est produite.
          # Il ne reste donc qu'une seule chose à poser : la clé.
          HEROKU_APP_NAME: ${{ vars.HEROKU_APP_NAME || secrets.HEROKU_APP_NAME || 'plum' }}
        run: |
          stack=$(curl -fsS "https://api.heroku.com/apps/$HEROKU_APP_NAME" \
            -H "Accept: application/vnd.heroku+json; version=3" \
            -H "Authorization: Bearer $HEROKU_API_KEY" \
            | python3 -c 'import sys,json;print(json.load(sys.stdin)["build_stack"]["name"])')

          if [ "$stack" = "container" ]; then
            echo "::notice::stack déjà « container »"
            exit 0
          fi

          echo "::notice::stack « $stack » → « container »"
          curl -fsS -X PATCH "https://api.heroku.com/apps/$HEROKU_APP_NAME" \
            -H "Content-Type: application/json" \
            -H "Accept: application/vnd.heroku+json; version=3" \
            -H "Authorization: Bearer $HEROKU_API_KEY" \
            -d '{"build_stack":"container"}' > /dev/null

      - name: Pousser l'image et publier
        if: steps.check.outputs.ready == 'true'
        env:
          HEROKU_API_KEY: ${{ secrets.HEROKU_API_KEY }}
          # Le nom de l'application n'est pas un secret : il est dans l'adresse
          # publique du site. L'exiger comme tel doublait la surface d'erreur
          # sans rien protéger — et c'est exactement là qu'elle s'est produite.
          # Il ne reste donc qu'une seule chose à poser : la clé.
          HEROKU_APP_NAME: ${{ vars.HEROKU_APP_NAME || secrets.HEROKU_APP_NAME || 'plum' }}
        run: |
          echo "$HEROKU_API_KEY" | docker login --username=_ --password-stdin registry.heroku.com
          image="registry.heroku.com/$HEROKU_APP_NAME/web"
          # Le Dockerfile et le contexte sont tous deux à la racine, quel que
          # soit le dossier d'où tourne cette étape.
          docker build -f "$GITHUB_WORKSPACE/Dockerfile" -t "$image" "$GITHUB_WORKSPACE"
          docker push "$image"

          # `container:release` needs the image digest, which the registry
          # knows and the push does not print in a usable form.
          digest=$(docker inspect "$image" --format '{{index .RepoDigests 0}}' | cut -d'@' -f2)
          curl -fsS -X PATCH "https://api.heroku.com/apps/$HEROKU_APP_NAME/formation" \
            -H "Content-Type: application/json" \
            -H "Accept: application/vnd.heroku+json; version=3.docker-releases" \
            -H "Authorization: Bearer $HEROKU_API_KEY" \
            -d "{\"updates\":[{\"type\":\"web\",\"docker_image\":\"$digest\"}]}"
