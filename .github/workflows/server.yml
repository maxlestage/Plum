name: Serveur

on:
  push:
    branches: [master]
    paths: ["server/**", "web/**", ".github/workflows/server.yml"]
  pull_request:
    paths: ["server/**", "web/**", ".github/workflows/server.yml"]
  workflow_dispatch:

concurrency:
  group: server-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: server

jobs:
  test:
    name: Build et tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: plum
          POSTGRES_DB: plum_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # Deliberately the Heroku spelling, so the URL normalisation is exercised
      # by every run rather than only by its unit test.
      TEST_DATABASE_URL: postgres://postgres:plum@localhost:5432/plum_test
      # Without this a Postgres that failed to start would show up as ten green
      # tests that executed nothing.
      REQUIRE_TEST_DATABASE: "1"

    steps:
      - uses: actions/checkout@v4

      - name: Chaîne d'outils
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          rustup default stable
          rustc --version

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: server

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Tests
        run: cargo test --all-targets

  image:
    name: Image Docker
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # Built on every change, deployed only from master with a configured
      # Heroku app: a broken Dockerfile should fail on the pull request, not on
      # the deploy.
      - name: Construire
        uses: docker/build-push-action@v6
        with:
          context: .
          file: server/Dockerfile
          push: false
          load: true
          tags: plum-server:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: L'image démarre et réclame sa configuration
        run: |
          set +e
          output=$(docker run --rm plum-server:ci 2>&1)
          code=$?
          set -e
          echo "$output"
          if [ $code -eq 0 ]; then
            echo "::error::le binaire devrait refuser de démarrer sans DATABASE_URL"
            exit 1
          fi
          echo "$output" | grep -q "DATABASE_URL" || {
            echo "::error::l'échec ne nomme pas la variable manquante"
            exit 1
          }

  deploy:
    name: Déployer sur Heroku
    needs: image
    if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Heroku est-il configuré ?
        id: check
        env:
          HEROKU_API_KEY: ${{ secrets.HEROKU_API_KEY }}
          HEROKU_APP_NAME: ${{ secrets.HEROKU_APP_NAME }}
        run: |
          if [ -n "$HEROKU_API_KEY" ] && [ -n "$HEROKU_APP_NAME" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::HEROKU_API_KEY ou HEROKU_APP_NAME absent — déploiement sauté. Poser les deux secrets dans Settings → Secrets and variables → Actions, et désactiver le déploiement automatique côté Heroku : les deux chaînes ne peuvent pas coexister."
          fi

      # Le registre de conteneurs n'accepte que les applications dont le stack
      # est « container », et ce réglage n'existe pas dans le tableau de bord :
      # c'est `heroku stack:set container`, donc une ligne de commande. Le
      # workflow le pose lui-même, sans quoi tout ceci ne marcherait que depuis
      # un ordinateur — ce qui est exactement ce qu'on cherche à éviter.
      #
      # Idempotent : reposer un stack qu'on a déjà ne change rien.
      - name: S'assurer que l'application est sur le stack container
        if: steps.check.outputs.ready == 'true'
        env:
          HEROKU_API_KEY: ${{ secrets.HEROKU_API_KEY }}
          HEROKU_APP_NAME: ${{ secrets.HEROKU_APP_NAME }}
        run: |
          stack=$(curl -fsS "https://api.heroku.com/apps/$HEROKU_APP_NAME" \
            -H "Accept: application/vnd.heroku+json; version=3" \
            -H "Authorization: Bearer $HEROKU_API_KEY" \
            | python3 -c 'import sys,json;print(json.load(sys.stdin)["build_stack"]["name"])')

          if [ "$stack" = "container" ]; then
            echo "::notice::stack déjà « container »"
            exit 0
          fi

          echo "::notice::stack « $stack » → « container »"
          curl -fsS -X PATCH "https://api.heroku.com/apps/$HEROKU_APP_NAME" \
            -H "Content-Type: application/json" \
            -H "Accept: application/vnd.heroku+json; version=3" \
            -H "Authorization: Bearer $HEROKU_API_KEY" \
            -d '{"build_stack":"container"}' > /dev/null

      - name: Pousser l'image et publier
        if: steps.check.outputs.ready == 'true'
        env:
          HEROKU_API_KEY: ${{ secrets.HEROKU_API_KEY }}
          HEROKU_APP_NAME: ${{ secrets.HEROKU_APP_NAME }}
        run: |
          echo "$HEROKU_API_KEY" | docker login --username=_ --password-stdin registry.heroku.com
          image="registry.heroku.com/$HEROKU_APP_NAME/web"
          # This step runs from server/ (job default), so the context is the
          # repository root one level up and the Dockerfile sits right here.
          docker build -f Dockerfile -t "$image" "$GITHUB_WORKSPACE"
          docker push "$image"

          # `container:release` needs the image digest, which the registry
          # knows and the push does not print in a usable form.
          digest=$(docker inspect "$image" --format '{{index .RepoDigests 0}}' | cut -d'@' -f2)
          curl -fsS -X PATCH "https://api.heroku.com/apps/$HEROKU_APP_NAME/formation" \
            -H "Content-Type: application/json" \
            -H "Accept: application/vnd.heroku+json; version=3.docker-releases" \
            -H "Authorization: Bearer $HEROKU_API_KEY" \
            -d "{\"updates\":[{\"type\":\"web\",\"docker_image\":\"$digest\"}]}"
