[package]
name = "plum-server"
version = "0.1.0"
edition = "2021"
rust-version = "1.80"

[dependencies]
axum = { version = "0.8", features = ["macros", "ws", "multipart"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal"] }
tower-http = { version = "0.6", features = ["trace", "cors", "fs"] }
# Pour couper le WebSocket en deux moitiés indépendantes : `axum` expose le
# socket comme `Stream` + `Sink` mais ne réexporte pas les extensions qui
# les rendent utilisables.
futures-util = { version = "0.3", default-features = false, features = ["std", "sink"] }

sea-orm = { version = "1", features = [
    "sqlx-postgres",
    "runtime-tokio-rustls",
    "macros",
    "with-uuid",
    "with-chrono",
    # `profiles.interests` is a text[]; without this the insert fails at run
    # time while compiling perfectly well.
    "postgres-array",
] }
migration = { path = "migration" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }

jsonwebtoken = "9"
argon2 = "0.5"
password-hash = { version = "0.5", features = ["rand_core"] }
rand = "0.8"
sha2 = "0.10"

# `tls-rustls-insecure` n'est pas une facilité : sans elle, le fragment
# `#insecure` est accepté puis refusé à la connexion avec « Cannot create
# insecure client without tls-rustls-insecure feature ». Heroku présente un
# certificat auto-signé sur ses add-ons Redis, et sa propre documentation
# prescrit de ne pas le vérifier ; le trafic ne quitte pas son réseau privé.
redis = { version = "0.27", features = [
    "tokio-comp",
    "tokio-rustls-comp",
    "tls-rustls-insecure",
    "connection-manager",
] }
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
# Le seul moyen de prouver que le socket marche vraiment : la poignée de
# main WebSocket a besoin d'un vrai serveur écoutant sur un vrai port, ce
# que `tower::oneshot` ne fait pas. La version suit celle qu'`axum` utilise
# lui-même, sinon deux `tungstenite` incompatibles cohabitent dans l'arbre.
tokio-tungstenite = "0.29"
sea-orm-migration = { version = "1", features = ["sqlx-postgres", "runtime-tokio-rustls"] }

[profile.release]
# Heroku charges for boot time, not build time — and the build happens in CI
# anyway. Optimise for a small, fast binary.
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
